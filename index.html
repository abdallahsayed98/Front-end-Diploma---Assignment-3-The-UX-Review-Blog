<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/media.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <div class="header">
        <div class="container">
            <div class="panel flex align-items-center justify-content-between bg-white border">
                <div class="logo"><a href="#">
                        <span>The UX</span>
                        <span>Review</span>
                    </a></div>
                <a href="#mobile-menu"
                    class="menu-toggle flex flex-column align-items-center justify-content-center border box-shadow xl-hidden">
                    <span></span>
                    <span></span>
                    <span></span>
                </a>
                <div class="main-nav hidden xl-display-block">
                    <div class="flex align-items-center">
                        <a href="#">HOME</a>
                        <div class="start-icon">
                            <img src="images/icons/star-solid-full.png" class="w-100 h-100 object-cover"
                                alt="star-icon">
                        </div>
                        <a href="#latest-articles">LATEST ARTICLES</a>
                        <div class="start-icon">
                            <img src="images/icons/star-solid-full.png" class="w-100 h-100 object-cover"
                                alt="star-icon">
                        </div>
                        <a href="#authors">AUTHORS</a>
                        <div class="start-icon">
                            <img src="images/icons/star-solid-full.png" class="w-100 h-100 object-cover"
                                alt="star-icon">
                        </div>
                        <a href="#community">COMMUNITY</a>
                    </div>
                </div>
                <a href="#community" class="main-subscribe hidden xl-display-block border">
                    SUBSCRIBE NOW
                </a>
                <div id="mobile-menu" class="mobile-menu-container">
                    <div class="mobile-menu-content bg-white h-100">
                        <div class="menu-padding flex flex-column">
                            <div class="menu-header flex justify-content-between align-items-center">
                                <span>MENU</span>
                                <a href="#" class="flex justify-content-center align-items-center border">&times;</a>
                            </div>
                            <div class="nav-menu flex flex-column">
                                <a href="#">HOME</a>
                                <a href="#latest-articles">LATEST ARTICLES</a>
                                <a href="#authors">AUTHORS</a>
                                <a href="#community">COMMUNITY</a>
                            </div>
                            <a href="#community"
                                class="subscribe flex align-items-center justify-content-center box-shadow">
                                <div class="icon">
                                    <img src="images/icons/rocket-solid-full.png" class="w-100 h-100 object-cover"
                                        alt="rocket icon">
                                </div>
                                SUBSCRIBE NOW
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="hero border">
        <div class="cubes">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="container">
            <div class="grid lg-grid">
                <div>
                    <div class="trending border box-shadow"><span>🔥 TRENDING NOW</span></div>
                    <h1>
                        <span class="black">BRUTAL</span>
                        <span class="red">THOUGHTS</span>
                        <span class="blue">BOLD IDEAS</span>
                    </h1>
                    <p class="border box-shadow">Raw, unfiltered content about tech, design, and culture. No sugar-coating, just pure truth that
                        hits different.</p>
                    <div class="buttons flex">
                        <button class="flex align-items-center">
                            <div class="button-icon">
                                <img class="w-100 h-100 object-cover" src="images/icons/rocket-solid-full.png" alt="rocket-icon">
                            </div>
                            START READING
                        </button>
                        <button class="flex align-items-center">
                            <div class="button-icon">
                                <img class="w-100 h-100 object-cover" src="images/icons/play-solid-full.png" alt="play-icon">
                            </div>
                            WATCH INTRO
                        </button>
                    </div>
                </div>
                <div class="banner">
                    <img class="w-100 h-100 object-cover" src="images/hero-img.png" alt="hero-img">
                    <span class="border box-shadow">FEATURED</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
